name: Finding quality gate
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/schemas/finding.schema.json'
      - '.github/workflows/finding-quality-gate.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - '.github/schemas/finding.schema.json'
      - '.github/workflows/finding-quality-gate.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
